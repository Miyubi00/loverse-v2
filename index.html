<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180x180.png" />

    />
    <!-- Verifikasi Google Search Console: tempel meta tag dari
         https://search.google.com/search-console di bawah baris ini. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "LoVerse",
        "url": "https://loverse.id/",
        "logo": "https://loverse.id/logo.png",
        "sameAs": ["https://instagram.com/loverse.id"]
      }
    </script>
    <title>LoVerse — Undangan pernikahan digital untuk hari istimewa Anda.</title>

    <!-- Open Graph / WhatsApp / Twitter preview (halaman utama).
         Untuk /wedding/:slug & /demo/:slug meta ini ditimpa server-side
         oleh edge function og-meta (lihat vercel.json rewrites). -->
    <meta property="og:title" content="LoVerse — Undangan pernikahan digital untuk hari istimewa Anda." />
    <meta property="og:description" content="LoVerse adalah platform untuk membuat dan membagikan undangan pernikahan digital." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://loverse.id/" />
    <meta property="og:image" content="https://loverse.id/logo.png" />
    <meta property="og:image:width" content="680" />
    <meta property="og:image:height" content="220" />
    <meta property="og:image:alt" content="Loverse — undangan pernikahan digital" />
    <meta property="og:locale" content="id_ID" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LoVerse — Undangan pernikahan digital untuk hari istimewa Anda." />
    <meta name="twitter:description" content="LoVerse adalah platform untuk membuat dan membagikan undangan pernikahan digital." />
    <meta name="twitter:image" content="https://loverse.id/logo.png" />
    <meta name="twitter:image:alt" content="Loverse — undangan pernikahan digital" />

    <!-- 
      Midtrans Snap Widget
      SECURITY NOTE:
      - Script Snap dimuat dinamis oleh src/lib/midtransConfig.ts berdasarkan
        VITE_MIDTRANS_ENVIRONMENT ('sandbox' | 'production') — tidak di-hardcode.
      - Payment tokens are generated server-side (never exposed to frontend)
      - Server key is stored securely in Supabase as environment secret
    -->
  </head>
