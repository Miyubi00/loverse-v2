<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://r2.loverse.id" />
    <link
      rel="preload"
      href="/fonts/fraunces-variable-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="/fonts/instrument-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="image"
      media="(min-width: 768px)"
      href="/previews/rustic-floral.webp"
      imagesrcset="/previews/rustic-floral-240.webp 240w, /previews/rustic-floral-400.webp 400w, /previews/rustic-floral.webp 512w"
      imagesizes="(max-width: 767px) 120px, 200px"
      fetchpriority="high"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LoVerse adalah platform untuk membuat dan membagikan undangan pernikahan digital."
    />
    <!-- Verifikasi Google Search Console: tempel meta tag dari
         https://search.google.com/search-console di bawah baris ini. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "LoVerse",
        "url": "https://loverse.id/",
        "logo": "https://loverse.id/logo.png",
        "sameAs": ["https://instagram.com/loverse.id"]
      }
    </script>
    <title>LoVerse — Undangan pernikahan digital untuk hari istimewa Anda.</title>

    <!-- Open Graph / WhatsApp / Twitter preview (halaman utama).
         Untuk /wedding/:slug & /demo/:slug meta ini ditimpa server-side
         oleh edge function og-meta (lihat vercel.json rewrites). -->
    <meta property="og:title" content="LoVerse — Undangan pernikahan digital untuk hari istimewa Anda." />
    <meta property="og:description" content="LoVerse adalah platform untuk membuat dan membagikan undangan pernikahan digital." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://loverse.id/" />
    <meta property="og:image" content="https://loverse.id/logo.png" />
    <meta property="og:image:width" content="680" />
    <meta property="og:image:height" content="220" />
    <meta property="og:image:alt" content="Loverse — undangan pernikahan digital" />
    <meta property="og:locale" content="id_ID" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LoVerse — Undangan pernikahan digital untuk hari istimewa Anda." />
    <meta name="twitter:description" content="LoVerse adalah platform untuk membuat dan membagikan undangan pernikahan digital." />
    <meta name="twitter:image" content="https://loverse.id/logo.png" />
    <meta name="twitter:image:alt" content="Loverse — undangan pernikahan digital" />
    <script>
      if (location.pathname.startsWith("/demo/")) {
        const demoCover = document.createElement("link");
        demoCover.rel = "preload";
        demoCover.as = "image";
        demoCover.href = "https://r2.loverse.id/defaults/img/385e020e17.jpg";
        demoCover.setAttribute("fetchpriority", "high");
        document.head.append(demoCover);
      }
    </script>

    <!-- 
      Midtrans Snap Widget
      SECURITY NOTE:
      - Script Snap dimuat dinamis oleh src/lib/midtransConfig.ts berdasarkan
        VITE_MIDTRANS_ENVIRONMENT ('sandbox' | 'production') — tidak di-hardcode.
      - Payment tokens are generated server-side (never exposed to frontend)
      - Server key is stored securely in Supabase as environment secret
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import "/src/index.css";

      const supabaseUrl = import.meta.env.VITE_SUPABASE_URL;
      if (supabaseUrl) {
        try {
          const preconnect = document.createElement("link");
          preconnect.rel = "preconnect";
          preconnect.href = new URL(supabaseUrl).origin;
          preconnect.crossOrigin = "anonymous";
          document.head.append(preconnect);
        } catch {
          // URL invalid: continue without the optional connection hint.
        }
      }

      const isPrerenderedHome = location.pathname === "/" || location.pathname === "/index.html";
      const root = document.getElementById("root");

      if (!isPrerenderedHome) {
        // Route lain belum punya HTML prerender; mulai React segera agar
        // route chunk, data, dan gambar LCP mulai diminta tanpa menunggu FCP.
        root?.replaceChildren();
        import("/src/main.tsx");
      } else {
        // Beranda sudah tersedia di HTML. Hidrasi setelah first paint agar
        // bundle aplikasi tidak bersaing dengan aset yang menentukan LCP.
        let appStarted = false;
        const startApp = () => {
          if (appStarted) return;
          appStarted = true;
          import("/src/main.tsx");
        };

        if (document.readyState === "complete") {
          startApp();
        } else if ("PerformanceObserver" in window) {
          try {
            const observer = new PerformanceObserver((list) => {
              if (list.getEntries().some((entry) => entry.name === "first-contentful-paint")) {
                observer.disconnect();
                startApp();
              }
            });
            observer.observe({ type: "paint", buffered: true });
            window.setTimeout(startApp, 3000);
          } catch {
            window.addEventListener("load", startApp, { once: true });
          }
        } else {
          window.addEventListener("load", startApp, { once: true });
        }
      }
    </script>
  </body>
</html>
